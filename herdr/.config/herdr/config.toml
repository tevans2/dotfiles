# herdr configuration, bound to match tmux muscle memory (~/.config/tmux/tmux.conf).
# Full key list: `prefix+?` in herdr, or "keys." in https://herdr.dev/docs/config-reference/
# Keybindings are client-side, so this file also drives panes on homebox.

onboarding = false

[theme]
name = "dracula"

[keys]
prefix = "ctrl+a"

# tmux: | splits right, - splits down
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = "prefix+minus"

# tmux: Ctrl+Tab / Ctrl+Shift+Tab cycle windows (kitty sends them as CSI codes)
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]

# tmux: < and > move the window left and right
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

settings = "prefix+comma"

# s: the agent/terminal picker (g is lazygit, below); e: the workspace picker
goto = "prefix+s"
workspace_picker = ["prefix+e", "prefix+w"]
edit_scrollback = "prefix+shift+e"

# tmux: r reloads the config
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: C-x kills the session
close_workspace = ["prefix+shift+d", "prefix+ctrl+x"]

# tmux: f floating shell
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "floating shell"
width = "80%"
height = "80%"

# tmux: m runs make in a popup
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "make; exec \"${SHELL:-sh}\""
description = "make"
width = "80%"
height = "80%"

# tmux: g lazygit
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"
