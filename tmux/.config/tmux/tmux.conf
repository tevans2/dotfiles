set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g allow-passthrough on

set-option -g detach-on-destroy off

set -g mouse on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# floating terminal
bind-key f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T "Terminal" $SHELL

# Floating terminal that runs `make`
bind-key m display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T "Make" "$SHELL -c 'make; exec $SHELL'"


# reload tmux config with ctrl + a + r
 unbind r
 bind r \
     source-file ~/.config/tmux/tmux.conf \;\
         display 'Reloaded tmux config.'



set -g base-index 1
set -g history-limit 1000000
set -g set-clipboard on

# set-option remain-on-exit on
set -g renumber-windows on   # renumber all windows when any window is closed
set -g escape-time 0         # zero-out escape time delay
set-window-option -g mode-keys vi

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=black bg=white  "
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""

# Navigate windows using Ctrl+Tab and Ctrl+Shift+Tab
bind -n C-Tab select-window -n
bind -n C-BTab select-window -p

# Vertical & Horizontal splits with | or -
unbind |
unbind -
bind-key | split-window -h
bind-key - split-window

# # Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'chirstoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


