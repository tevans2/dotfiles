bind b run-shell "tmux setw -g status \$(tmux show -g -w status | grep -q off && echo on || echo off)"


# Continuum options:
set -g @continuum-restore 'on'
# (optional) adjust save interval:
set -g @continuum-save-interval '10'   # every 10 minutes
set -g @resurrect-dir "$HOME/.tmux/resurrect"




# Save and restore bindings for tmux-resurrect
bind S run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'
bind R run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'

# pdf opener
# ~/.tmux.conf
bind-key P display-popup -E -w 100% -h 100% -T "Open PDF" \
  'PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; ~/.config/scripts/tmux-open-pdf.sh >~/.pdfx.log 2>&1'

bind f run "tmux neww ~/.config/scripts/tmux-session-dispensary.sh"
bind t run "tmux neww ~/.config/scripts/time.sh"
bind N run "~/.config/scripts/tmux-session-dispensary.sh ~/Developer/nimble/"
bind u run "~/.config/scripts/tmux-session-dispensary.sh ~/Documents/uni-work/second-year/"
bind D run "~/.config/scripts/tmux-session-dispensary.sh ~/dotfiles/"
bind H run "~/.config/scripts/tmux-session-dispensary.sh ~"

bind G neww -n "git" -S lazygit
bind P neww -n "prs" -S gh dash
bind C neww -n 'claude' -S claude --resume
bind O run "~/.config/scripts/open-gh.sh"

bind o neww -S -n "BOOKMARKS" "nvim ~/bookmarks.csv"
bind e neww -S "nvim ~/bookmarks.csv"
bind E show-environment -g




bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""



# Keep at bottom
run '~/.config/tmux/plugins/tpm/tpm'
