set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set-option -g allow-passthrough on

set-option -g detach-on-destroy off

set -g mouse on

set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# floating terminal
bind-key f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T "Terminal" $SHELL

# Floating terminal that runs `make`
bind-key m display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T "Make" "$SHELL -c 'make; exec $SHELL'"


# reload tmux config with ctrl + a + r
 unbind r
 bind r \
     source-file ~/.config/tmux/tmux.conf \;\
         display 'Reloaded tmux config.'



set -g base-index 1
set -g history-limit 100000
set -g set-clipboard on
set -g focus-events on

# set-option remain-on-exit on
set -g renumber-windows on   # renumber all windows when any window is closed
set -g escape-time 0         # zero-out escape time delay
set-window-option -g mode-keys vi

# Copy in scrollback without leaving copy-mode. Use q/C-c to exit and save the return point.
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi C-j send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear


# Remember where copy-mode was exited and jump back with C-o.
# The helper stores an absolute history line, not just the current scroll
# offset, so the jump still lands on the same line after more output appears.
bind-key -T copy-mode-vi q \
  run-shell 'bash ~/.config/scripts/tmux-scrollback-return.sh save "#{pane_id}"' \; \
  send-keys -X cancel
bind-key -T copy-mode-vi C-c \
  run-shell 'bash ~/.config/scripts/tmux-scrollback-return.sh save "#{pane_id}"' \; \
  send-keys -X cancel
bind-key -T copy-mode-vi C-o \
  run-shell 'bash ~/.config/scripts/tmux-scrollback-return.sh restore "#{pane_id}"'
# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=black bg=white"
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""

set -g window-status-format "#{?#{==:#{@agent_state},working},#[fg=yellow]● ,#{?#{==:#{@agent_state},blocked},#[fg=red]● ,#{?#{==:#{@agent_unread},1},#[fg=green]● ,}}} #I:#W  "
set -g window-status-current-format "  #I:#W  "

# Clear an agent's unread marker as soon as the window is selected.
set-hook -g after-select-window 'set-window-option -u @agent_unread'


# Navigate windows using Ctrl+Tab and Ctrl+Shift+Tab
bind -n C-Tab select-window -n
bind -n C-BTab select-window -p

# Reorder windows.
bind-key < swap-window -t -1 \; select-window -t -1
bind-key > swap-window -t +1 \; select-window -t +1
bind-key M command-prompt -p "swap with window:" "swap-window -t '%%'"

# Vertical & Horizontal splits with | or -
unbind |
unbind -
bind-key | split-window -h
bind-key - split-window

# Create new windows immediately after the current window, shifting later
# windows right instead of appending at the end.
bind c new-window -a -c "#{pane_current_path}"

# # Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Keep Ctrl-l available for terminal clear-screen. vim-tmux-navigator would
# otherwise bind it globally to "select pane right", which becomes very
# noticeable when the agent sidebar creates a pane on the right.
set -g @vim_navigator_mapping_right "C-Right"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


