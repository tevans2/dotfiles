bind b run-shell "tmux setw -g status \$(tmux show -g -w status | grep -q off && echo on || echo off)"


# Continuum options:
set -g @continuum-restore 'on'
# (optional) adjust save interval:
set -g @continuum-save-interval '10'   # every 10 minutes
set -g @resurrect-dir "$HOME/.tmux/resurrect"


# Agent sidebar gets a window of its own rather than a split pane in every
# window: prefix+e opens it (binding is after TPM, at the bottom of this file).
# The plugin's own split-pane toggle stays available on prefix+C-e.
set -g @sidebar_auto_create off
set -g @sidebar_key C-e
set -g @plugin 'hiroppy/tmux-agent-sidebar'



# Activity watch watcher
set -g @plugin 'akohlbecker/aw-watcher-tmux'


# Save and restore bindings for tmux-resurrect
bind W run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'
bind R run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'


# Kill session key bind
bind C-x kill-session

# pdf opener
# ~/.tmux.conf
bind-key p display-popup -E -w 100% -h 100% -T "Open PDF" \
  'PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; ~/.config/scripts/tmux-open-pdf.sh >~/.pdfx.log 2>&1'

bind s choose-tree -Zs
bind S run-shell 'if tmux has-session -t apps 2>/dev/null; then if ! tmux list-windows -t apps -F "##{window_name}" | grep -qx "spotify"; then tmux new-window -t apps -n spotify "spotify_player"; fi; tmux switch-client -t apps \; select-window -t apps:spotify; else tmux new-session -d -s apps -n spotify "spotify_player"; tmux switch-client -t apps \; select-window -t apps:spotify; fi'
bind t neww -a -c "#{pane_current_path}" "~/.config/scripts/time.sh"
bind N run "~/.config/scripts/tmux-session-dispensary.sh ~/Developer/nimble/"
bind u run "~/.config/scripts/tmux-session-dispensary.sh ~/Documents/uni-work/second-year/"
bind D run "~/.config/scripts/tmux-session-dispensary.sh ~/dotfiles/"
bind H run "~/.config/scripts/tmux-session-dispensary.sh ~"

bind g neww -a -c "#{pane_current_path}" -n "git" -S lazygit
bind P neww -a -c "#{pane_current_path}" -n "prs" -S gh dash
bind C neww -a -c "#{pane_current_path}" -n "claude" claude
bind O run "~/.config/scripts/open-gh.sh"

bind o switch-client -l
bind e neww -a -c "#{pane_current_path}" -S "nvim ~/bookmarks.csv"
bind y setw synchronize-panes
bind z resize-pane -Z
bind E show-environment -g




bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""




# Keep TPM after plugin declarations.
run '~/.config/tmux/plugins/tpm/tpm'

# Agent sidebar in a window of its own instead of a split pane. Bound after TPM
# so it wins over the plugin's own prefix+e binding. -S reuses the existing
# "agents" window rather than opening a second one.
#
# The sidebar has no agent pane beside it here, so its Activity/Git panel starts
# empty: press Enter on a row to point the panel at that agent.
bind-key e neww -a -n agents -S 'exec "$(tmux show -gv @agent_sidebar_bin)"'

# TPM/plugin reloads do not remove stale vim-tmux-navigator bindings. Keep
# Ctrl-l as terminal clear-screen; use Ctrl-Right for tmux navigate-right.
unbind-key -n C-l
unbind-key -T copy-mode-vi C-l
